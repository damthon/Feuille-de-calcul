name: Tests (Mur contre terre)

on:
  push:
    branches: ["**"]
    paths:
      - "Mur contre terre/**"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "Mur contre terre/**"
      - ".github/workflows/tests.yml"

defaults:
  run:
    working-directory: "Mur contre terre"

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install python3-tk (interface de bureau)
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb

      - name: Install project (extra [dev])
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Run test suite
        run: xvfb-run -a python -m pytest -q
