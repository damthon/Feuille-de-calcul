name: Build and release (Mur contre terre)

on:
  push:
    tags:
      - "mur-contre-terre-v*"
  workflow_dispatch: {}

permissions:
  contents: write

defaults:
  run:
    working-directory: "Mur contre terre"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pyinstaller

      - name: Run test suite
        run: python -m pytest -q

      - name: Build executable
        run: pyinstaller mur_contre_terre.spec --noconfirm

      - name: Autotest the built executable
        run: .\dist\MurContreTerre.exe --autotest

      - name: Package
        run: Compress-Archive -Path dist\MurContreTerre.exe -DestinationPath dist\MurContreTerre-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MurContreTerre-windows
          path: "Mur contre terre/dist/MurContreTerre-windows.zip"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/mur-contre-terre-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "${{ github.ref_name }}"
          "dist/MurContreTerre-windows.zip"
          --title "Mur contre-terre ${{ github.ref_name }}"
          --generate-notes
